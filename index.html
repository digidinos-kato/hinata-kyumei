識・技術の確保","教育を省略するため","報酬を増やすため","業務を減らすため"],"answer":0,"exp":"処置範囲の拡大には相応の教育・訓練が必要で、継続教育により安全性と質を確保する。"},{"id":"c5-348","n":348,"q":"救急救命士のプロトコル策定における中心的な役割を担う組織はどれか。","choices":["町内会","地域MC協議会","PTA","文化サークル"],"answer":1,"exp":"地域MC協議会がプロトコル策定や事後検証、教育等の中心的役割を担う。"},{"id":"c5-349","n":349,"q":"救急救命士法の「業務独占」の意味として正しいものはどれか。","choices":["看護業務を独占","救急救命処置は救急救命士等でなければ行ってはならない","診察業務を独占","医療業務すべてを独占"],"answer":1,"exp":"救急救命士法第43条は、保健師助産師看護師法の規定にかかわらず、救急救命士が診療の補助として救急救命処置を業として行うことを認めている。また第48条で救急救命士でない者の名称使用を禁止している（名称独占）。","revised":true},{"id":"c5-350","n":350,"q":"救急救命士の業務範囲拡大と地域格差の課題はどれか。","choices":["地域による医療資源の差が救急対応の質に影響する可能性","格差は発生しない","常に均等","課題はない"],"answer":0,"exp":"地域の医療資源やMC体制の差が救急対応の質に影響する可能性があり、標準化と地域格差の是正が課題。"},{"id":"c5-351","n":351,"q":"救急救命士が行う「観察」と「処置」の関係として最も正しいものはどれか。","choices":["観察なしに処置を開始","観察の結果に応じて適切な処置を行う","両者は無関係","処置後に観察する"],"answer":1,"exp":"救急現場ではまず観察し、得られた情報に基づき適切な処置を選択・実施する。"},{"id":"c5-352","n":352,"q":"救急救命士が行う救急搬送中の傷病者への再評価頻度として適切なものはどれか。","choices":["再評価は不要","搬送完了後のみ再評価","症状が変化しない限り不要","状態に応じて定期的に（例：数分ごと）再評価する"],"answer":3,"exp":"搬送中は状態に応じて定期的に再評価し、変化があれば即時対応することが重要。"},{"id":"c5-353","n":353,"q":"救急救命士が実施する処置の優先順位の基本はどれか。","choices":["家族の希望順","難易度の高い処置から始める","容易な処置から順に行う","生命維持に直結する処置から順に行う"],"answer":3,"exp":"救急救命処置は生命維持に直結するものから優先順位を付けて実施する。"},{"id":"c5-354","n":354,"q":"救急救命士のプロトコルにおける「包括的指示（standing order）」の意味はどれか。","choices":["処置を複数回繰り返す","特定の条件下では事前の包括的指示で処置できる仕組み","段階的に処置を増やす","段階的に処置を中止する"],"answer":1,"exp":"standing order（包括的指示）は、MC協議会等で事前に医師が定めた手順の範囲で、特定の条件下では個別の具体的指示を待たずに処置を行える仕組み。なお特定行為は原則として医師の具体的指示が必要である。","revised":true},{"id":"c5-355","n":355,"q":"救急救命士がエピネフリン投与後に観察すべき項目として最も重要なものはどれか。","choices":["体重変化","髪の色","皮膚の光沢","心拍・血圧・心電図波形の変化"],"answer":3,"exp":"エピネフリン投与後は心拍、血圧、心電図波形の変化をモニタリングし、効果と副作用を確認する。"},{"id":"c5-356","n":356,"q":"救急救命士が不確実な薬剤名を目視で確認できない場合の対応はどれか。","choices":["家族に判断を委ねる","指差呼称・Wチェック・医師確認等を行う","投与を強行する","自己判断で投与"],"answer":1,"exp":"薬剤名が不確実な場合は指差呼称・ダブルチェック・医師確認等を行い、確実に確認してから投与する。"},{"id":"c5-357","n":357,"q":"救急救命士の処置で「合併症が疑われる場合」の対応として正しいものはどれか。","choices":["患者に任せる","直ちに中止し再評価、MCと連絡する","継続する","家族に伝えない"],"answer":1,"exp":"合併症が疑われた時点で処置を中止し、再評価して医師と連絡を取ることが安全管理の基本。"},{"id":"c5-358","n":358,"q":"救急救命士の処置実施における「患者安全」の基本原則はどれか。","choices":["効率を最優先","患者情報の開示を拒否","迅速さのみを追求","「do no harm（害を与えない）」を原則に進める"],"answer":3,"exp":"医療倫理の基本である「do no harm（危害を加えない）」は救急救命士の処置にも当てはまる。"},{"id":"c5-359","n":359,"q":"輸液速度の決定に影響する要因として正しくないものはどれか。","choices":["患者の病態","プロトコル","医師指示","家族の感情"],"answer":3,"exp":"輸液速度は患者の病態、医師指示、プロトコルに基づき決定される。家族の感情は参考外。"},{"id":"c5-360","n":360,"q":"救急救命士の処置マニュアルはどの程度の頻度で見直されるべきか。","choices":["最新知見やガイドライン改訂に応じて定期的に見直す","一度決めたら一切変更しない","見直さない","10年ごと"],"answer":0,"exp":"新たな知見やガイドライン改訂に応じて定期的に見直し、地域MCで議論・更新することが望ましい。"},{"id":"c5-361","n":361,"q":"救急救命士と看護師の関係として正しいものはどれか。","choices":["上下関係である","競合関係である","独立した資格だが、協働して傷病者ケアに当たる","同一資格である"],"answer":2,"exp":"救急救命士と看護師は別資格だが、救急医療の場面では協働して傷病者ケアに当たる。"},{"id":"c5-362","n":362,"q":"救急救命士が業務上知り得た情報について正しいものはどれか。","choices":["SNSで発信してよい","公に共有してよい","家族に無断で公開してよい","守秘義務を負い、みだりに漏らしてはならない"],"answer":3,"exp":"救急救命士法により守秘義務が課されており、業務上知り得た情報をみだりに漏らしてはならない。"},{"id":"c5-363","n":363,"q":"守秘義務違反の罰則は救急救命士法ではどのように扱われているか。","choices":["罰則はない","業務停止のみ","違反に対する罰則が設けられている","拘禁刑（懲役）のみ"],"answer":2,"exp":"救急救命士法は守秘義務（第47条）違反に対して50万円以下の罰金を定めている（第54条、告訴がなければ公訴を提起できない親告罪）。","revised":true},{"id":"c5-364","n":364,"q":"救急救命士がSNS等で業務情報を発信する行為は、原則どうすべきか。","choices":["実名で発信すれば問題ない","自由に発信できる","守秘義務・プライバシー保護の観点から行わない","写真を添付すれば問題ない"],"answer":2,"exp":"業務情報のSNS発信は守秘義務違反や患者のプライバシー侵害につながるため行うべきではない。"},{"id":"c5-365","n":365,"q":"救急救命士が処置実施時に心理的ストレスを感じた場合の対応として正しいものはどれか。","choices":["同僚・上司・心理専門家に相談する","一人で抱え込む","業務を放棄する","患者に当たる"],"answer":0,"exp":"救急救命士は強いストレスを受けやすく、デブリーフィングやメンタルヘルスの支援を活用することが重要。"},{"id":"c5-366","n":366,"q":"PTSD（心的外傷後ストレス障害）の予防・早期発見に有効な取り組みはどれか。","choices":["無視","職場内での叱責","休暇の完全禁止","デブリーフィングや相談体制の整備"],"answer":3,"exp":"救急職員はPTSDリスクがあり、事後デブリーフィングや専門家相談体制の整備が重要。"},{"id":"c5-367","n":367,"q":"救急救命士が処置に関して医療過誤を起こした場合の対応として正しいものはどれか。","choices":["事実を正確に記録し、速やかに報告する","隠蔽する","家族に責任を押し付ける","記録を改ざんする"],"answer":0,"exp":"医療過誤発生時は速やかに事実を報告・記録し、原因究明と再発防止策を講じることが必要。"},{"id":"c5-368","n":368,"q":"救急救命士が行う処置の責任主体として正しいものはどれか。","choices":["責任は発生しない","医師の指示と救急救命士の双方に責任がある","救急救命士のみ","医師のみ"],"answer":1,"exp":"救急救命士の処置は医師の指示に基づく協働であり、指示医師と実施した救急救命士の双方に責任が生じる。"},{"id":"c5-369","n":369,"q":"救急救命士の「生涯学習」の考え方として正しいものはどれか。","choices":["学習は任意","資格取得後も継続的に知識・技術を更新する","一度資格を取れば学習不要","知識は変化しない"],"answer":1,"exp":"医療・救急の知識は日々更新されるため、救急救命士には生涯学習が求められる。"},{"id":"c5-370","n":370,"q":"救急救命士が医師以外の医療職と連携する際に大切なことはどれか。","choices":["無視する","情報を独占する","相互理解と尊重","上下関係の強調"],"answer":2,"exp":"チーム医療では職種間の相互理解と尊重が基本となり、患者の最善の利益を共有することが重要。"},{"id":"c5-371","n":371,"q":"救急救命士の処置実施時に「感染」を避ける原則はどれか。","choices":["マスクを外す","手袋を使い回す","手洗いを省略","標準予防策と清潔操作の徹底"],"answer":3,"exp":"処置前後の手指衛生、手袋交換、清潔操作の徹底が感染予防の基本。"},{"id":"c5-372","n":372,"q":"救急救命士が行う処置に「家族への説明」が求められる理由はどれか。","choices":["家族を巻き込むため","不安軽減と協力獲得、情報共有のため","家族を排除するため","家族を責めるため"],"answer":1,"exp":"家族への説明は不安軽減と協力獲得に寄与し、医療職と家族間の情報共有の基礎となる。"},{"id":"c5-373","n":373,"q":"救急救命士が実施する処置の「効果評価」で重要な観点はどれか。","choices":["時刻のみ","担当者の印象のみ","バイタルサインの変化・症状改善の客観的指標","家族の意見のみ"],"answer":2,"exp":"処置の効果はバイタルサインや症状変化等の客観的指標で評価し、必要に応じて追加処置を検討する。"},{"id":"c5-374","n":374,"q":"救急救命士が処置実施時に意識すべき「多職種連携」の利点はどれか。","choices":["情報遮断","連携は不要","責任の回避","総合的な傷病者ケアの質向上"],"answer":3,"exp":"多職種連携は傷病者に対して総合的なケアを提供し、質と安全性を向上させる。"},{"id":"c5-375","n":375,"q":"救急救命士の処置実施に伴う「アカウンタビリティ（説明責任）」として正しいものはどれか。","choices":["機密のため公開しない","説明は不要","実施内容と根拠を説明できる状態にしておく","一切記録しない"],"answer":2,"exp":"救急救命士は処置の根拠と内容を関係者に説明できるよう、記録と論理的説明を準備しておく必要がある。"}]},{"id":"c6","kind":"chapter","title":"第6章 外傷と特殊病態・災害医療","subtitle":"外傷初期診療・頭部胸部腹部外傷・特殊状況・災害対応","questions":[{"id":"c6-376","n":376,"q":"外傷初期診療における「primary survey」で最初に評価するものはどれか。","choices":["気道（A）","環境（E）","循環（C）","意識（D）"],"answer":0,"exp":"外傷のprimary surveyはA→B→C→D→Eの順で評価し、気道確保から開始する。"},{"id":"c6-377","n":377,"q":"外傷初期診療で「B」が評価する項目はどれか。","choices":["Behavior","呼吸（Breathing）","Balance","Blood type"],"answer":1,"exp":"BはBreathing＝呼吸の評価。呼吸数、呼吸音、SpO2等を確認する。"},{"id":"c6-378","n":378,"q":"外傷初期診療で「C」が評価する内容はどれか。","choices":["Cord","Collapse","Color","循環（Circulation）"],"answer":3,"exp":"CはCirculation＝循環の評価で、脈拍・血圧・出血・末梢循環等を確認する。"},{"id":"c6-379","n":379,"q":"外傷primary surveyで「E」が評価する内容はどれか。","choices":["Eye","全身観察と体温管理（Exposure/Environment）","Elbow","Ear"],"answer":1,"exp":"Eは全身観察と体温管理（exposure/environment）であり、隠れた外傷の発見と体温保持に配慮する。"},{"id":"c6-380","n":380,"q":"頭部外傷でJCSが100以上の場合の一般的対応はどれか。","choices":["様子を見て経過観察","三次救急施設への搬送","軽症扱いとする","自宅療養を勧める"],"answer":1,"exp":"JCS100以上は重症意識障害を示し、頭蓋内病変の可能性が高く三次救急医療機関への搬送が求められる。"},{"id":"c6-381","n":381,"q":"外傷性脳損傷で予後悪化の要因となる二次損傷はどれか。","choices":["高体温のみ","高血糖のみ","食事摂取のみ","低酸素と低血圧"],"answer":3,"exp":"外傷性脳損傷では低酸素・低血圧が二次損傷を引き起こし予後を悪化させるため、ABCの早期安定化が重要。"},{"id":"c6-382","n":382,"q":"頸部外傷で全脊柱固定を行うべき基準として適切なものはどれか。","choices":["咳嗽のみ","軽度擦過傷のみ","発熱のみ","意識障害、神経症状、受傷機転から疑われる場合"],"answer":3,"exp":"意識障害、神経症状、高エネルギー外傷等の場合は全脊柱固定を行う。"},{"id":"c6-383","n":383,"q":"胸部外傷で致死的な所見として「緊張性気胸」を疑う徴候はどれか。","choices":["発熱と発汗","気管偏位・頸静脈怒張・患側呼吸音減弱","軽度腹痛","多尿と頻脈"],"answer":1,"exp":"緊張性気胸は気管の健側偏位、頸静脈怒張、患側呼吸音の減弱が典型所見。"},{"id":"c6-384","n":384,"q":"腹部外傷で腹腔内出血を疑う所見はどれか。","choices":["腹部膨満、圧痛、ショック徴候","咳嗽のみ","関節痛のみ","発熱のみ"],"answer":0,"exp":"腹部膨満、圧痛、ショック徴候等は腹腔内出血を示唆し、迅速な搬送が必要。"},{"id":"c6-385","n":385,"q":"骨盤骨折で発生し得る合併症はどれか。","choices":["軽度の打撲","腹部だるさのみ","単なる発熱","大量出血・内臓損傷"],"answer":3,"exp":"骨盤骨折は大量の腹腔内・後腹膜出血を起こす可能性があり、ショックに陥りやすい。"},{"id":"c6-386","n":386,"q":"四肢骨折の初期処置として適切なものはどれか。","choices":["強く引っ張る","温める","自由に動かす","固定と冷却、愛護的取り扱い"],"answer":3,"exp":"四肢骨折は適切な固定と冷却、愛護的な取り扱いが基本で、神経血管の評価も重要。"},{"id":"c6-387","n":387,"q":"脊髄損傷が疑われる場合の移送として正しいものはどれか。","choices":["頚部を回旋させる","自力歩行させる","体をねじる","愛護的に全脊柱固定した上で搬送する"],"answer":3,"exp":"脊髄損傷疑いの傷病者は全脊柱を中立位で固定し、愛護的に搬送する必要がある。"},{"id":"c6-388","n":388,"q":"重症外傷の搬送先選定で優先すべきものはどれか。","choices":["眼科診療所","歯科診療所","外傷センター等の高次医療機関","美容整形外科"],"answer":2,"exp":"重症外傷は外傷センター等、外傷対応能力の高い医療機関への搬送が原則。"},{"id":"c6-389","n":389,"q":"外傷傷病者の搬送に際して使用される代表的な固定具はどれか。","choices":["バックボードとヘッドイモビライザー","布団","靴下","タオルのみ"],"answer":0,"exp":"重症外傷の搬送ではバックボードとヘッドイモビライザー、ストラップ等で全脊柱固定を行う。"},{"id":"c6-390","n":390,"q":"外傷患者の「ロードアンドゴー」の考え方として正しいものはどれか。","choices":["搬送を遅らせる","現場で完全に治療する","重症外傷では現場滞在を短くして迅速に搬送する","家族の意向優先"],"answer":2,"exp":"重症外傷では現場滞在を短く抑え、決定的治療が可能な医療機関への迅速搬送を優先する考え方がロードアンドゴー。"},{"id":"c6-391","n":391,"q":"ロードアンドゴーの適応となる所見はどれか。","choices":["軽度の鼻血","軽度の足関節捻挫","軽微な切り傷","ABC異常、意識障害、ショック徴候"],"answer":3,"exp":"ABCの異常やショック徴候、意識障害など生命に関わる兆候があればロードアンドゴーの適応となる。"},{"id":"c6-392","n":392,"q":"重症外傷における輸液戦略として最近注目されるのはどれか。","choices":["輸液禁止","許容的低血圧（permissive hypotension）による過剰輸液回避","高張食塩水のみ","大量輸液"],"answer":1,"exp":"重症外傷では出血助長の観点から過剰輸液を避け、許容的低血圧戦略が採られることがある。"},{"id":"c6-393","n":393,"q":"熱傷による体液喪失の対応として正しいものはどれか。","choices":["輸液禁忌","適切な輸液量の計算（重症度・体表面積に応じた）","経口水分のみ","必要量を超える過剰輸液"],"answer":1,"exp":"重症熱傷では体液喪失が顕著で、体表面積や体重に応じた輸液量を計算し補充する。"},{"id":"c6-394","n":394,"q":"吸入熱傷（気道熱傷）を疑う所見として正しいものはどれか。","choices":["腹部の創傷のみ","顔面の煤付着、眉毛・鼻毛焼損、嗄声","下肢の発赤のみ","手指の冷感のみ"],"answer":1,"exp":"顔面の煤・眉毛鼻毛焼損・嗄声・咳嗽・喘鳴等は吸入熱傷のサイン。気道閉塞のリスクが高い。"},{"id":"c6-395","n":395,"q":"電撃傷（感電）の特徴として正しいものはどれか。","choices":["必ず皮膚が広範に損傷する","体表面は軽微でも深部に重大な損傷を伴うことがある","呼吸停止は起きない","深部損傷は起きない"],"answer":1,"exp":"電撃傷は入出口の皮膚損傷が小さく見えても、体内を電流が通過し筋・心臓・神経等に重大な損傷を与える。"},{"id":"c6-396","n":396,"q":"薬毒物への曝露傷病者の初期対応として正しいものはどれか。","choices":["保護具は不要","直ちに傷病者に接触する","救助者は介入しない","救助者の安全確保・曝露回避を優先する"],"answer":3,"exp":"薬毒物曝露現場では救助者自身の安全確保と個人防護具装着が最優先。二次被害を防ぐ必要がある。"},{"id":"c6-397","n":397,"q":"中毒情報センター等への問い合わせで入手する情報はどれか。","choices":["原因物質の毒性情報と対応方針","交通情報","個人情報のみ","天気予報"],"answer":0,"exp":"中毒情報センター（日本中毒情報センター）は原因物質の毒性、症状、対応方針等の情報を提供している。"},{"id":"c6-398","n":398,"q":"有機リン中毒（農薬等）の代表的症状はどれか。","choices":["散瞳・乾燥皮膚のみ","発熱のみ","縮瞳・多量流涎・気管支分泌物増加・けいれん","関節痛のみ"],"answer":2,"exp":"有機リン中毒ではコリン作動性症状（縮瞳、流涎、気管支分泌過多、けいれん等）が特徴的。"},{"id":"c6-399","n":399,"q":"シアン化合物中毒の特徴はどれか。","choices":["軽度皮膚発赤のみ","嘔吐のみ","細胞呼吸の阻害による急激な意識障害","単なる頭痛のみ"],"answer":2,"exp":"シアン化合物は細胞呼吸を阻害し、急激な意識障害・心停止に至る重症中毒を起こす。"},{"id":"c6-400","n":400,"q":"リチウムイオン電池火災時の注意点として正しいものはどれか。","choices":["水で濡らせば安全","通常の火災と同じ扱い","有毒ガスと熱暴走に注意する","燃焼しない"],"answer":2,"exp":"リチウムイオン電池は熱暴走を起こし、有毒ガスや爆発の危険があるため特別な対応が必要。"},{"id":"c6-401","n":401,"q":"特殊災害（NBC）対応で重要な原則はどれか。","choices":["即時傷病者接触","隊員の安全確保と適切な除染","除染は行わない","防護具不要"],"answer":1,"exp":"NBC（核・生物・化学）災害では隊員の安全確保と適切な除染が必須となる。"},{"id":"c6-402","n":402,"q":"災害現場でのトリアージタグの色と意味の組み合わせで正しいものはどれか。","choices":["赤＝最優先・黄＝待機・緑＝軽症・黒＝救命困難","黒＝軽症","緑＝重症","赤＝軽症・黄＝最優先"],"answer":0,"exp":"トリアージタグは赤（最優先）・黄（待機）・緑（軽症）・黒（救命困難）の4色で優先順位を示す。"},{"id":"c6-403","n":403,"q":"大量傷病者発生時のトリアージで最初に行うべきことはどれか。","choices":["詳細な病歴聴取","保険証確認","全員への詳細検査","迅速な1次トリアージ（START法等）"],"answer":3,"exp":"大量傷病者発生時は迅速な1次トリアージで優先順位をつけ、その後2次トリアージで詳細評価する。"},{"id":"c6-404","n":404,"q":"START法で呼吸数を評価する基準として正しいものはどれか。","choices":["毎分10回以下は緑","呼吸数は関係ない","毎分30回を超える場合は赤に分類","呼吸の性状のみで判断"],"answer":2,"exp":"START法では呼吸数30回/分を超える場合は赤（最優先）に分類する。"},{"id":"c6-405","n":405,"q":"START法のCRT評価で赤と判定する基準はどれか。","choices":["CRTでは評価しない","2秒以上","0.5秒未満","1秒で黒"],"answer":1,"exp":"START法ではCRT（毛細血管再充満時間）2秒以上を赤（最優先）と判定する基準の一つとしている。"},{"id":"c6-406","n":406,"q":"災害医療活動における「CSCATTT」の「A」が示すものはどれか。","choices":["Assessment（評価）","Alert","Action","Arrest"],"answer":0,"exp":"CSCATTTのAはAssessment（評価）を意味する。"},{"id":"c6-407","n":407,"q":"災害拠点病院の役割として正しいものはどれか。","choices":["薬局業務のみ","平時の一般診療のみ","救急車両の整備のみ","多数傷病者への高度医療対応と地域医療支援"],"answer":3,"exp":"災害拠点病院は災害時の多数傷病者への高度医療対応と地域医療機関への支援を行う役割を担う。"},{"id":"c6-408","n":408,"q":"「防ぎえた外傷死（preventable trauma death）」を減らすための取り組みはどれか。","choices":["迅速搬送・適切な初期治療・外傷センター整備","外傷センターの削減","搬送を遅らせる","現場治療のみ"],"answer":0,"exp":"防ぎえた外傷死は迅速な搬送、適切な初期治療、外傷センターの整備等により減少させることができる。"},{"id":"c6-409","n":409,"q":"熱傷傷病者の初期対応で重要なものはどれか。","choices":["経口補水のみ","温める","経過観察のみ","早期の冷却と気道評価"],"answer":3,"exp":"熱傷は早期冷却により障害進行を抑え、同時に気道熱傷の評価と対応を行う。"},{"id":"c6-410","n":410,"q":"熱傷の深度分類のⅢ度（全層熱傷）の特徴はどれか。","choices":["軽度の発赤","痛みをあまり感じない、白色・黒色皮膚","強い痛みと水疱","軽い腫脹"],"answer":1,"exp":"Ⅲ度熱傷は真皮全層に及び、神経末端まで破壊されるため痛みが軽く、皮膚は白色や黒色を呈する。"},{"id":"c6-411","n":411,"q":"妊婦の外傷で注意すべき点はどれか。","choices":["母体蘇生が胎児の救命につながる","胎児は常に無事","胎児のみを救う","母体は無視する"],"answer":0,"exp":"妊婦外傷では母体蘇生・安定化が胎児の救命につながるため、母体管理を最優先する。"},{"id":"c6-412","n":412,"q":"小児外傷で大人と異なる特徴はどれか。","choices":["頭部が相対的に大きく頭部外傷を起こしやすい","成人より骨折しにくい","代償能力が極めて高い","体温調節が完璧"],"answer":0,"exp":"小児は頭部が相対的に大きく頭部外傷を起こしやすい。体温調節や循環代償も成人とは異なる。"},{"id":"c6-413","n":413,"q":"高齢者外傷の特徴として正しいものはどれか。","choices":["体力が豊富","軽微な外力でも骨折・頭蓋内出血が生じやすい","薬剤影響がない","転倒しない"],"answer":1,"exp":"高齢者は骨粗鬆症や抗凝固薬内服等で、軽微な外力でも骨折・頭蓋内出血を起こしやすい。"},{"id":"c6-414","n":414,"q":"脊髄損傷で「完全損傷」が疑われる場合の神経学的所見はどれか。","choices":["違和感のみ","一過性しびれ","不完全麻痺","損傷レベル以下の運動・感覚の完全消失"],"answer":3,"exp":"完全脊髄損傷では損傷レベル以下の運動・感覚が完全に消失する。"},{"id":"c6-415","n":415,"q":"脊髄損傷の神経学的分類（ASIA）で「A」に該当する状態はどれか。","choices":["不全麻痺で運動機能優位に残存","感覚のみ残存","完全麻痺","正常"],"answer":2,"exp":"ASIA（米国脊髄障害協会）分類のAは完全麻痺（運動・感覚消失）を示す。"},{"id":"c6-416","n":416,"q":"出血性ショックの重症度で「クラスⅢ」の特徴として最も適切なものはどれか。","choices":["循環血液量の30〜40%の喪失、頻脈と血圧低下","出血量10%未満","症状なし","血圧正常"],"answer":0,"exp":"出血性ショックのクラスⅢは循環血液量の30〜40%喪失で、頻脈と血圧低下、不安・混乱などを示す。"},{"id":"c6-417","n":417,"q":"頭部外傷に伴うびまん性軸索損傷の特徴はどれか。","choices":["意識障害は生じない","運動麻痺は起きない","必ずCTで明らかな血腫がみられる","受傷直後から意識障害を呈し、CTでは明らかな所見が乏しいことがある"],"answer":3,"exp":"びまん性軸索損傷は高エネルギー頭部外傷で生じ、直後から意識障害を呈するが画像上所見が乏しい場合がある。"},{"id":"c6-418","n":418,"q":"硬膜外血腫の典型的な経過はどれか。","choices":["受傷後に一時的に意識清明期（lucid interval）がみられる","受傷直後から徐脈になる","症状は全くない","必ず意識障害が持続する"],"answer":0,"exp":"硬膜外血腫では一時的な意識清明期（lucid interval）を経て意識障害が進行する経過が典型。"},{"id":"c6-419","n":419,"q":"硬膜下血腫は急性・亜急性・慢性に分類される。慢性硬膜下血腫の特徴はどれか。","choices":["症状は出ない","数時間で昏睡に至る","小児に多い","高齢者で軽微な外傷後に数週間〜数ヶ月で症状出現"],"answer":3,"exp":"慢性硬膜下血腫は軽微な頭部外傷後数週〜数ヶ月を経て症状が現れ、高齢者で多くみられる。"},{"id":"c6-420","n":420,"q":"脊柱固定を行う必要がない状況はどれか。","choices":["意識障害あり","高エネルギー外傷","転倒後に歩行可能で意識清明、痛みや神経症状がない軽症例","神経症状あり"],"answer":2,"exp":"脊柱固定の必要性は受傷機転・意識・神経症状・痛みから判断され、ClinicalクリアーなMinor traumaでは不要となり得る。"},{"id":"c6-421","n":421,"q":"多発外傷（multitrauma）で救命率に最も影響するのはどれか。","choices":["現場滞在時間の延長","迅速な搬送と外傷センター等での早期対応","家族の同乗","搬送速度の抑制"],"answer":1,"exp":"多発外傷の予後は早期根本治療に左右されるため、迅速な搬送と外傷センター等への集中搬送が重要。"},{"id":"c6-422","n":422,"q":"腹部刺創でみえる臓器は原則としてどう扱うか。","choices":["乾燥させる","清潔操作は不要","戻さずに清潔な湿潤ドレッシングで保護する","強く押し込む"],"answer":2,"exp":"腹部臓器脱出は戻さず、清潔な湿潤ガーゼ等で保護しそのまま搬送するのが原則。"},{"id":"c6-423","n":423,"q":"小児頭部外傷で注意すべき点はどれか。","choices":["成人と同じ扱い","頭部の相対的大きさと予後に関わる二次損傷の予防","小児は外傷に強いため軽視","無視してよい"],"answer":1,"exp":"小児は頭部が体幹に対して大きく、頭部外傷を起こしやすい。二次損傷防止のために早期対応が重要。"},{"id":"c6-424","n":424,"q":"交通事故による外傷で、ダッシュボード損傷と関連する外傷はどれか。","choices":["足関節捻挫","指先の切創","股関節脱臼や大腿骨骨折","発熱"],"answer":2,"exp":"ダッシュボードに膝が突き当たる機転では、膝・大腿骨・股関節損傷を生じることがある。"},{"id":"c6-425","n":425,"q":"高所からの墜落で疑うべき外傷は何か。","choices":["軽度頭痛のみ","脊椎・下肢・踵骨骨折等","咳のみ","食欲不振のみ"],"answer":1,"exp":"高所墜落では踵骨骨折、脊椎骨折、下肢骨折、内臓損傷等を疑う必要がある。"},{"id":"c6-426","n":426,"q":"爆傷（blast injury）で分類される一次損傷とは何か。","choices":["熱傷のみ","破片による損傷","爆風圧による気体含有臓器（肺・鼓膜等）の損傷","吹き飛ばされた二次外傷"],"answer":2,"exp":"一次損傷は爆風圧による気体含有臓器（肺・鼓膜・腸管等）の損傷で、爆傷特有の病態。"},{"id":"c6-427","n":427,"q":"爆傷の二次損傷はどれか。","choices":["精神的ショックのみ","爆風圧のみ","破片等による貫通性外傷","直接的火災"],"answer":2,"exp":"二次損傷は飛散する破片や物体による貫通性外傷を指す。"},{"id":"c6-428","n":428,"q":"高体温による熱中症の予防として適切なものはどれか。","choices":["断水","厚着","水分・電解質補給と適切な休息","運動強制"],"answer":2,"exp":"熱中症予防には水分と電解質の適切な補給、休息、環境調整が重要。"},{"id":"c6-429","n":429,"q":"凍傷の処置として正しいものはどれか。","choices":["適切な温度の温水での緩徐な復温","マッサージ","直火で温める","冷水で冷却"],"answer":0,"exp":"凍傷は37〜40℃程度の温水での緩徐な復温が推奨され、マッサージや直火は禁忌。"},{"id":"c6-430","n":430,"q":"山岳遭難等での低体温症の初期対応として正しいものはどれか。","choices":["激しい運動","アルコール摂取","濡れた衣服の除去と保温、愛護的取り扱い","強いマッサージ"],"answer":2,"exp":"低体温症では濡れた衣服を除去して乾燥させ、毛布等で保温し愛護的に扱う。心室細動リスクのため激しい動揺は避ける。"},{"id":"c6-431","n":431,"q":"溺水傷病者でCPRを行う場合の特徴として正しいものはどれか。","choices":["圧迫は不要","低酸素が主病態のため換気を早期に行う","換気は不要","搬送を遅らせる"],"answer":1,"exp":"溺水では低酸素が主因のため、BLSの早期換気と十分な胸骨圧迫が重要。"},{"id":"c6-432","n":432,"q":"高地肺水腫の初期対応として正しいものはどれか。","choices":["激しい運動","速やかに下山し酸素投与","水分制限","更に高所へ登る"],"answer":1,"exp":"高地肺水腫は速やかに低高度へ下降し、酸素投与と安静が第一選択。"},{"id":"c6-433","n":433,"q":"減圧症の初期対応として適切なものはどれか。","choices":["アルコール摂取","100%酸素投与と高気圧酸素療法施設への搬送","冷水浸漬","追加潜水"],"answer":1,"exp":"減圧症では100%酸素投与と速やかな高気圧酸素療法が基本の対応。"},{"id":"c6-434","n":434,"q":"蜂刺傷でアナフィラキシーを疑う場合の対応はどれか。","choices":["抗生物質を投与","冷却のみ","エピネフリン筋注の準備と迅速搬送","様子観察のみ"],"answer":2,"exp":"蜂刺傷によるアナフィラキシーではエピネフリン投与と迅速搬送が救命に直結する。"},{"id":"c6-435","n":435,"q":"ヘビ咬傷の対応として誤っているものはどれか。","choices":["患部の固定","速やかな搬送","安静","切開吸引"],"answer":3,"exp":"切開吸引は現代では推奨されない。安静、固定、迅速搬送が基本的対応となる。"},{"id":"c6-436","n":436,"q":"大量傷病者発生時の「2次トリアージ」は何を評価するか。","choices":["体温のみ","保険情報","住所のみ","生理学的・解剖学的な重症度を詳細評価し搬送順を決定する"],"answer":3,"exp":"2次トリアージは詳細な生理学的・解剖学的評価により搬送先・搬送順位を決定する段階。"},{"id":"c6-437","n":437,"q":"災害現場での「テンポラリー モルグ」の目的はどれか。","choices":["避難所を設ける","傷病者を治療する","食事を提供する","死亡者を一時的に安置する場所を確保すること"],"answer":3,"exp":"多数死亡者発生時はテンポラリーモルグを設け、尊厳を保ちつつ一時安置する。"},{"id":"c6-438","n":438,"q":"災害医療における「サージ容量」とは何か。","choices":["看護師数のみ","通常以上の傷病者数を受け入れるための医療資源の対応能力","救急車の台数","医師数のみ"],"answer":1,"exp":"サージ容量は平時を超える傷病者数に対応するための人的・物的・施設面の追加対応能力を示す概念。"},{"id":"c6-439","n":439,"q":"EMIS（広域災害救急医療情報システム）の主な役割はどれか。","choices":["災害時の医療機関の被災・受入状況を共有するシステム","電子カルテ","救急車の配車システム","薬剤管理システム"],"answer":0,"exp":"EMISは災害時に医療機関の被災状況・受入状況を共有するためのシステムで、広域医療連携に活用される。"},{"id":"c6-440","n":440,"q":"DMATの活動内容として正しくないものはどれか。","choices":["被災地での医療支援","災害発生後の長期復興支援のみ","現場救護所運営","広域医療搬送"],"answer":1,"exp":"DMATは災害急性期（概ね48時間以内）の医療支援を担い、長期復興支援は別チームが対応する。"},{"id":"c6-441","n":441,"q":"災害時に「クラッシュ症候群」を疑う状況はどれか。","choices":["咳嗽のみ","長時間四肢が圧迫された後の解放","単発の頭痛","軽い捻挫"],"answer":1,"exp":"クラッシュ症候群は長時間の筋組織圧迫解放後にカリウム・ミオグロビン等が血中に流入し、高カリウム血症や腎不全等を起こす。"},{"id":"c6-442","n":442,"q":"クラッシュ症候群の初期対応として重要なものはどれか。","choices":["救出前後の輸液と電解質管理","放置","水分制限","解放後に安静のみ"],"answer":0,"exp":"クラッシュ症候群では救出前後の大量輸液により電解質異常と急性腎障害を予防することが重要。"},{"id":"c6-443","n":443,"q":"災害時に救急救命士が果たす役割として正しいものはどれか。","choices":["手術執刀","薬剤の独自処方","診断書作成","現場でのトリアージ・応急処置・搬送支援"],"answer":3,"exp":"災害時の救急救命士の役割はトリアージ、応急処置、搬送支援等であり、診断書作成や手術は業務範囲外。"},{"id":"c6-444","n":444,"q":"災害対応における「自助・共助・公助」の順序として基本的な考え方はどれか。","choices":["まず自助、次に共助、そして公助","自助は不要","共助は不要","公助のみ"],"answer":0,"exp":"災害対応は基本的に自助（自分で身を守る）→共助（近隣との助け合い）→公助（行政支援）の順で機能する。"},{"id":"c6-445","n":445,"q":"多数傷病者発生時に救急活動で最も避けるべきことはどれか。","choices":["迅速なトリアージ","継続的な再評価","1人に時間をかけすぎて全体の対応が遅れること","チーム連携"],"answer":2,"exp":"災害時は1人に時間をかけすぎると全体の救命率が低下するため、迅速なトリアージと効率的対応が重要。"},{"id":"c6-446","n":446,"q":"外傷の観察で「ABCDE」に続いてすべき追加観察項目（FGH）の一例はどれか。","choices":["Family（家族名）","Full set of vital signs や History（問診）","Food（好み）","Friend（友人）"],"answer":1,"exp":"ABCDE後はFull set of vital signs、問診、FASTなどで評価を深めるのが一般的な外傷診療の流れ。"},{"id":"c6-447","n":447,"q":"救急搬送中に患者状態が急変した場合の対応として正しいものはどれか。","choices":["搬送停止","観察を中断","適切な処置を実施しMCへ連絡して指示を仰ぐ","家族判断に委ねる"],"answer":2,"exp":"搬送中の急変時は速やかな処置とオンラインMCによる医師指示の確認が重要。"},{"id":"c6-448","n":448,"q":"救急救命士が現場活動で使用する用具の点検・整備の頻度として適切なものはどれか。","choices":["年1回のみ","故障発生時のみ","整備は不要","勤務開始時・使用前後に点検する"],"answer":3,"exp":"救急用具は勤務開始時や使用前後に定期的に点検し、常に使用可能な状態を保つ必要がある。"},{"id":"c6-449","n":449,"q":"救急救命士が重症傷病者搬送時に病院選定で協力を求めるべき制度はどれか。","choices":["一切の連絡なし","搬送・受入ルール（搬送基準・傷病者情報共有システム等）","家族の主観","診療所選定のみ"],"answer":1,"exp":"都道府県ごとに搬送・受入ルールや情報共有システムが整備されており、それを用いて適切な病院を選定する。"},{"id":"c6-450","n":450,"q":"救急救命士が災害対応の経験から学ぶべき大切な姿勢はどれか。","choices":["記録しない","活動内容を秘匿する","忘れる","振り返りと改善、そして次への備え"],"answer":3,"exp":"災害対応後の振り返り（デブリーフィング）と組織的改善は次の災害への備えとして重要である。"}]},{"id":"mock","kind":"mock","title":"模擬試験 第1回","subtitle":"本番形式・50問","questions":[{"id":"mock-451","n":451,"q":"救急救命士の業務は誰の指示のもとで行われるか（特定行為）。","choices":["消防長","警察官","看護師","医師"],"answer":3,"exp":"救急救命士の特定行為は医師の具体的指示のもとで実施される。"},{"id":"mock-452","n":452,"q":"救急救命士法が公布された年はどれか。","choices":["2015年","2000年","1991年","1980年"],"answer":2,"exp":"救急救命士法は1991年に公布・施行された。"},{"id":"mock-453","n":453,"q":"JCSで「呼びかけで開眼する」状態に相当するのはどれか。","choices":["II-10","I-2","II-20","III-100"],"answer":0,"exp":"II-10は普通の呼びかけで容易に開眼する意識レベル。II-20は大きな声または体を揺さぶることにより開眼、II-30は痛み刺激を加えつつ呼びかけを繰り返すとかろうじて開眼する。","revised":true},{"id":"mock-454","n":454,"q":"GCSの最高点はいくつか。","choices":["12","10","20","15"],"answer":3,"exp":"GCSはE4+V5+M6の合計15が最高点。"},{"id":"mock-455","n":455,"q":"成人の正常脈拍の範囲はどれか。","choices":["150〜180回/分","60〜100回/分","200〜300回/分","30〜40回/分"],"answer":1,"exp":"成人の安静時脈拍は60〜100回/分が正常範囲。"},{"id":"mock-456","n":456,"q":"SpO2の一般的な正常範囲はどれか。","choices":["100%以上","60%前後","50%以下","96〜100%"],"answer":3,"exp":"成人のSpO2正常範囲は概ね96〜100%とされる。"},{"id":"mock-457","n":457,"q":"成人CPRの胸骨圧迫の深さとして推奨されるものはどれか。","choices":["約10cm","約5cm（6cmを超えない）","約2cm","指が届く程度"],"answer":1,"exp":"成人では約5cm（6cmを超えない）が推奨される。"},{"id":"mock-458","n":458,"q":"成人CPRの圧迫テンポは毎分何回が推奨されるか。","choices":["100〜120回","30回以下","60回程度","200回以上"],"answer":0,"exp":"成人は毎分100〜120回が推奨されるテンポ。"},{"id":"mock-459","n":459,"q":"成人1人法BLSの胸骨圧迫と換気の比率はどれか。","choices":["5:1","30:2","50:1","15:2"],"answer":1,"exp":"成人1人法は30:2サイクルで実施する。"},{"id":"mock-460","n":460,"q":"AEDが通電する不整脈はどれか。","choices":["PEA","心室細動・無脈性VT","心静止","洞徐脈"],"answer":1,"exp":"AEDはVFと無脈性VTに対して通電する。"},{"id":"mock-461","n":461,"q":"PEAや心静止に対して行うべき処置はどれか。","choices":["質の高いCPRと可逆的原因の検索","経口水分補給","放置","除細動"],"answer":0,"exp":"PEAや心静止では除細動は適応外で、質の高いCPRと可逆的原因（5H5T）の検索が重要。"},{"id":"mock-462","n":462,"q":"成人CPRでエピネフリンの通常用量はどれか。","choices":["100mg","10mg","0.01mg","1mg"],"answer":3,"exp":"成人CPRではエピネフリン1mgを3〜5分ごとに投与する。"},{"id":"mock-463","n":463,"q":"特定行為として低血糖傷病者に対して投与できる薬剤はどれか。","choices":["塩化カリウム","モルヒネ","ブドウ糖溶液","インスリン"],"answer":2,"exp":"血糖測定により低血糖と判明した場合、救急救命士はブドウ糖溶液を投与できる。"},{"id":"mock-464","n":464,"q":"気管挿管の位置確認で最も信頼性が高いのはどれか。","choices":["触診のみ","視診のみ","EtCO2波形","心電図"],"answer":2,"exp":"EtCO2波形による確認が最も信頼性が高く、食道挿管の見逃し防止に有効。"},{"id":"mock-465","n":465,"q":"アナフィラキシーの第一選択薬はどれか。","choices":["抗ヒスタミン薬","ステロイド","エピネフリン（筋注）","ブドウ糖"],"answer":2,"exp":"アナフィラキシーの初期治療はエピネフリン筋注が第一選択。"},{"id":"mock-466","n":466,"q":"熱中症の応急対応として正しいものはどれか。","choices":["温風での加温","厚着","断水","涼しい場所への移動と体表冷却"],"answer":3,"exp":"熱中症は速やかに涼しい場所へ移動し体表冷却を行う。"},{"id":"mock-467","n":467,"q":"低体温症でCPR中止前に考慮すべきことはどれか。","choices":["輸液は禁忌","十分な復温を試みる","即時中止","気道管理は不要"],"answer":1,"exp":"低体温症では復温しない限り死亡判定は行わず、復温を試みながらCPRを継続する。"},{"id":"mock-468","n":468,"q":"脳卒中の観察評価に   for (const id of ids){
    const r = store.q[id]; if (!r) continue;
    if (what === 'wrong' || what === 'all'){ r.wrong = false; r.streak = 0; }
    if (what === 'stats' || what === 'all'){ r.attempts = 0; r.correct = 0; r.last = null; r.streak = 0; delete r.ts; }
  }
  save();
}

function statsOf(ids){
  let answered = 0, lastOk = 0, wrong = 0;
  for (const id of ids){
    const r = store.q[id];
    if (!r) continue;
    if (r.attempts > 0){ answered++; if (r.last === 1) lastOk++; }
    if (r.wrong) wrong++;
  }
  return { total: ids.length, answered, wrong, acc: answered ? Math.round(lastOk / answered * 100) : null };
}
const secIds = s => s.questions.map(q => q.id);
const wrongIds = () => ALL_IDS.filter(isWrong);
const bmIds = () => ALL_IDS.filter(isBm);

/* ---------- helpers ---------- */
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function splitTitle(s){
  const t = String(s.title || '');
  const i = t.search(/[\s　]/);
  if (i > 0 && /^(第|Part|模擬)/.test(t)) return { k: t.slice(0, i), n: t.slice(i).trim() };
  return { k: '', n: t };
}
function shortLabel(s){ const p = splitTitle(s); return p.k || p.n; }
function fmtTime(ms){
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const pad = n => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function fmtDate(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
const reduceMotion = () => { try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
function pctMsg(p){
  if (p >= 90) return 'すばらしい！この調子でいこう。';
  if (p >= 70) return 'よくできました。間違えた問題を確認しよう。';
  if (p >= 50) return 'あと一歩。復習で確実に伸ばそう。';
  return '解説を読んで、もう一度チャレンジしよう。';
}

    <section class="card score"><p class="muted small">${esc(s ? s.title : '模擬試験')}</p>
      <p class="big" tabindex="-1" data-focus>${MR.score}<small> / ${MR.ids.length}問</small></p><p class="pct">正答率 ${p}%</p>
      <p class="msg">経過時間 ${fmtTime(MR.elapsed)}${MR.unanswered ? `・未回答 ${MR.unanswered}問` : ''}<br>${pctMsg(p)}</p></section>
    <div class="quick">
      ${wrongN ? `<button class="btn btn-primary" data-act="mrRetry">間違えた問題だけもう一度（${wrongN}問）</button>` : ''}
      <button class="btn" data-act="home">ホームへ</button>
    </div>
    <h2 class="sec-h">全問の結果（タップで解説）</h2>
    ${MR.ids.map(id => { const a = MR.answers[id]; const m = a == null ? 'na' : a === QMAP.get(id).q.answer ? 'ok' : 'ng'; return reviewItem(id, a, m); }).join('')}
  </main>`;
}

function vLists(){
  const tab = view.tab === 'bm' ? 'bm' : 'wrong';
  const ids = tab === 'bm' ? bmIds() : wrongIds();
  const other = tab === 'bm' ? wrongIds().length : bmIds().length;
  const wc = tab === 'wrong' ? ids.length : other, bc = tab === 'bm' ? ids.length : other;
  let body;
  if (!ids.length){
    body = `<p class="empty">${tab === 'bm' ? '★を付けた問題はまだありません。<br>問題画面の「保存」で追加できます。' : '復習が必要な問題はありません。<br>この調子！'}</p>`;
  } else {
    body = `<button class="btn btn-primary" data-act="listPlay" data-tab="${tab}" style="margin-bottom:8px">この${ids.length}問を解く</button>
      <button class="btn" data-act="listPlay" data-tab="${tab}" data-shuffle="1" style="margin-bottom:14px">シャッフルして解く</button>
      ${tab === 'wrong' ? '<p class="small muted" style="margin-bottom:10px">間違えたあと2回続けて正解すると、このリストから外れます。</p>' : ''}
      ${ids.map(id => reviewItem(id, null, tab === 'bm' ? 'st' : 'ng')).join('')}`;
  }
  return topbar(backBtn(), '<span tabindex="-1" data-focus>復習リスト</span>') + `<main class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" data-act="lists" data-tab="wrong" aria-selected="${tab === 'wrong'}">間違えた問題 ${wc}</button>
      <button role="tab" data-act="lists" data-tab="bm" aria-selected="${tab === 'bm'}">★ 保存 ${bc}</button>
    </div>${body}</main>`;
}

function vSettings(){
  const all = statsOf(ALL_IDS);
  let att = 0; for (const id of ALL_IDS){ const r = store.q[id]; if (r) att += r.attempts; }
  const th = store.theme || 'auto';
  const opt = (v, l) => `<label><input type="radio" name="theme" value="${v}" ${th === v ? 'checked' : ''}><span>${l}</span></label>`;
  return topbar(backBtn(), '<span tabindex="-1" data-focus>設定</span>') + `<main class="wrap stack">
    <section class="card"><h2>表示テーマ</h2><p class="small muted">「自動」は端末の設定に合わせます。</p>
      <div class="seg" role="radiogroup" aria-label="表示テーマ">${opt('auto', '自動')}${opt('light', 'ライト')}${opt('dark', 'ダーク')}</div></section>
    <section class="card"><h2>学習の記録</h2>
      <p class="small muted">解いた問題 ${all.answered} / ${TOTAL}・のべ解答数 ${att}・復習中 ${wrongIds().length}・保存 ${bmIds().length}</p>
      <p class="small muted" style="margin-top:6px">記録はこの端末のこのブラウザだけに保存されます。${storageOK ? '' : '<br><b>現在、保存できない状態です。</b>'}</p></section>
    <section class="card"><h2>記録をクリア</h2><p class="small muted" style="margin-bottom:12px">★保存した問題はどちらでも残ります。章ごとのクリアは各章の画面からできます。</p>
      <div class="stack">
        <button class="btn" data-act="clearAsk" data-what="wrong" ${wrongIds().length ? '' : 'disabled'}>復習リストをクリア（${wrongIds().length}問）</button>
        <button class="btn" data-act="clearAsk" data-what="stats" ${all.answered ? '' : 'disabled'}>正答率・解答記録をクリア</button>
      </div></section>
    <section class="card"><h2>進捗をすべてリセット</h2><p class="small muted" style="margin-bottom:12px">すべての解答記録・復習リスト・保存・模試の結果を消去します。元に戻せません。</p>
      <button class="btn btn-danger" data-act="resetAsk">進捗をリセット</button></section>
  </main>`;
}

/* ---------- render ---------- */
function render(toTop){
  let html;
  switch (view.name){
    case 'start': html = vStart(); break;
    case 'quiz': html = S ? vQuiz() : vHome(); break;
    case 'result': html = S ? vResult() : vHome(); break;
    case 'mock': html = M ? vMock() : vHome(); break;
    case 'mockResult': html = MR ? vMockResult() : vHome(); break;
    case 'lists': html = vLists(); break;
    case 'settings': html = vSettings(); break;
    default: html = vHome();
  }
  app.innerHTML = html;
  if (toTop) window.scrollTo(0, 0);
  const f = app.querySelector('[data-focus]');
  if (f && toTop){ try{ f.focus({ preventScroll:true }); }catch(e){} }
}

/* ---------- practice ---------- */
function startPractice(ids, title){
  ids = ids.filter(id => QMAP.has(id));
  if (!ids.length) return;
  S = { title, ids, i:0, picked:null, log:[] };
  go('quiz');
}
function pick(i){
  if (!S || S.picked != null) return;
  const id = S.ids[S.i], q = QMAP.get(id).q;
  if (i < 0 || i >= q.choices.length) return;
  const ok = i === q.answer;
  S.picked = i;
  record(id, ok); save();
  S.log.push({ id, choice:i, ok });
  render(false);
  const fb = document.getElementById('fb');
  if (fb){
    try{ fb.focus({ preventScroll:true }); }catch(e){}
    try{ fb.scrollIntoView({ block:'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' }); }catch(e){ fb.scrollIntoView(); }
  }
}
function next(){
  if (!S || S.picked == null) return;
  S.i++; S.picked = null;
  if (S.i >= S.ids.length) go('result'); else render(true);
}

/* ---------- mock ---------- */
function persistDraft(){
  if (!M) return;
  store.draft = { sid:M.sid, ids:M.ids, answers:M.answers, i:M.i, elapsed:mockElapsed() };
  save();
}
function mockBegin(sid){
  const s = SEC(sid); if (!s) return;
  M = { sid, ids: secIds(s), answers:{}, i:0, elapsed:0, runStart:Date.now(), grid:false };
  persistDraft(); go('mock');
}
function mockResume(){
  const d = store.draft; if (!d || !SEC(d.sid)) return;
  const ids = d.ids.filter(id => QMAP.has(id));
  if (!ids.length){ store.draft = null; save(); go('home'); return; }
  M = { sid:d.sid, ids, answers: d.answers || {}, i: Math.min(d.i || 0, ids.length - 1), elapsed: d.elapsed || 0, runStart: Date.now(), grid:false };
  go('mock');
}
function mockGrade(){
  const elapsed = mockElapsed();
  let score = 0, un = 0;
  for (const id of M.ids){
    const a = M.answers[id];
    if (a == null){ un++; continue; }
    const ok = a === QMAP.get(id).q.answer;
    if (ok) score++;
    record(id, ok);
  }
  if (!store.mocks) store.mocks = {};
  const h = store.mocks[M.sid] || (store.mocks[M.sid] = []);
  h.push({ date: Date.now(), score, total: M.ids.length, elapsed });
  if (h.length > 20) h.splice(0, h.length - 20);
  store.draft = null;
  save();
  MR = { sid:M.sid, ids:M.ids, answers:M.answers, elapsed, score, unanswered:un };
  M = null;
  go('mockResult');
}
setInterval(() => {
  if (view.name === 'mock' && M){ const t = document.getElementById('timer'); if (t) t.textContent = fmtTime(mockElapsed()); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && M && view.name === 'mock') persistDraft(); });
window.addEventListener('pagehide', () => { if (M && view.name === 'mock') persistDraft(); });

/* ---------- modal ---------- */
function openModal(o){
  modalOk = o.onOk;
  modalEl.innerHTML = `<div class="scrim" data-act="modalCancel"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mdt" data-stop>
    <h2 id="mdt">${esc(o.title)}</h2><p>${esc(o.body)}</p>
    <div class="btn-row"><button class="btn" data-act="modalCancel" id="mdCancel">${esc(o.cancel || 'キャンセル')}</button><button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" data-act="modalOk">${esc(o.ok || 'OK')}</button></div>
  </div></div>`;
  const c = document.getElementById('mdCancel'); if (c) c.focus();
}
function closeModal(){ modalEl.innerHTML = ''; modalOk = null; }

/* ---------- actions ---------- */
const ACT = {
  home(){ S = null; go('home'); },
  settings(){ go('settings'); },
  openSection(d){ go('start', { sid:d.id }); },
  mode(d){
    const s = SEC(d.sid); if (!s) return;
    let ids = secIds(s), name = shortLabel(s);
    if (d.mode === 'rand'){ ids = shuffle(ids); name += '（ランダム）'; }
    else if (d.mode === 'new'){ ids = ids.filter(id => !isAnswered(id)); name += '（未回答）'; }
    else if (d.mode === 'wrong'){ ids = ids.filter(isWrong); name += '（復習）'; }
    startPractice(ids, name);
  },
  random10(){ startPractice(shuffle(ALL_IDS).slice(0, 10), 'ランダム10問'); },
  reviewWrong(){ startPractice(wrongIds(), '間違えた問題の復習'); },
  lists(d){ go('lists', { tab:d.tab }); },
  listPlay(d){
    let ids = d.tab === 'bm' ? bmIds() : wrongIds();
    if (d.shuffle) ids = shuffle(ids);
    startPractice(ids, d.tab === 'bm' ? '★保存した問題' : '間違えた問題の復習');
  },
  pick(d){ pick(+d.i); },
  next(){ next(); },
  quit(){ S = null; go('home'); },
  bm(d, el){
    const on = toggleBm(d.id);
    document.querySelectorAll('.star-btn[data-id="' + (window.CSS && CSS.escape ? CSS.escape(d.id) : d.id) + '"]').forEach(b => {
      b.setAttribute('aria-pressed', on); const sp = b.querySelector('span'); if (sp) sp.textContent = on ? '保存済' : '保存';
    });
  },
  retryWrong(){ if (S) startPractice(S.log.filter(x => !x.ok).map(x => x.id), '間違えた問題をもう一度'); },
  retrySame(){ if (S) startPractice(S.ids.slice(), S.title); },
  mockStart(d){
    if (store.draft && store.draft.sid){
      openModal({ title:'最初からやり直しますか？', body:'途中まで解いた模擬試験の解答は消えます。', ok:'やり直す', danger:true, onOk(){ store.draft = null; save(); mockBegin(d.sid); } });
    } else mockBegin(d.sid);
  },
  mockResume(){ mockResume(); },
  mpick(d){
    if (!M) return;
    const id = M.ids[M.i], i = +d.i;
    if (M.answers[id] === i) delete M.answers[id]; else M.answers[id] = i;
    persistDraft();
    const y = window.scrollY; render(false); window.scrollTo(0, y);
  },
  mprev(){ if (M && M.i > 0){ M.i--; persistDraft(); render(true); } },
  mnext(){ if (M && M.i < M.ids.length - 1){ M.i++; persistDraft(); render(true); } },
  mjump(d){ if (M){ M.i = +d.i; M.grid = false; persistDraft(); render(true); } },
  mgrid(){ if (M){ M.grid = !M.grid; render(true); } },
  mquit(){
    openModal({ title:'模擬試験を中断しますか？', body:'ここまでの解答と経過時間は保存されます。ホームの「続きから」で再開できます。', ok:'中断する', cancel:'続ける', onOk(){ persistDraft(); M = null; go('home'); } });
  },
  mgrade(){
    if (!M) return;
    const un = M.ids.length - Object.keys(M.answers).length;
    openModal({ title:'採点しますか？', body: un ? `未回答が${un}問あります。未回答は不正解として採点します。` : 'すべての問題に解答済みです。', ok:'採点する', cancel:'見直す', onOk(){ mockGrade(); } });
  },
  mrRetry(){
    if (!MR) return;
    const ids = MR.ids.filter(id => MR.answers[id] !== QMAP.get(id).q.answer);
    startPractice(ids, '模試の間違い直し');
  },
  clearAsk(d){
    const s = d.sid ? SEC(d.sid) : null;
    const ids = s ? secIds(s) : ALL_IDS;
    const where = s ? `「${shortLabel(s)}」の` : 'すべての問題の';
    const txt = {
      wrong: ['復習リストをクリアしますか？', `${where}「間違えた問題」リストを空にします。正答率と★はそのまま残ります。`],
      stats: ['正答率をクリアしますか？', `${where}解答記録（解いた数・正答率）を消します。復習リストと★はそのまま残ります。`],
      all:   ['記録をリセットしますか？', `${where}正答率・復習リスト${s && s.kind === 'mock' ? '・模試の結果' : ''}を消します。★は残ります。元に戻せません。`]
    }[d.what];
    if (!txt) return;
    openModal({ title: txt[0], body: txt[1], ok: 'クリアする', danger: true, onOk(){
      clearRecords(ids, d.what);
      if (s && s.kind === 'mock' && d.what === 'all' && store.mocks){ delete store.mocks[s.id]; save(); }
      render(false);
    } });
  },
  resetAsk(){
    openModal({ title:'進捗をリセットしますか？', body:'すべての解答記録・復習リスト・保存した問題・模試の結果が消えます。元に戻せません。', ok:'リセットする', danger:true,
      onOk(){ const theme = store.theme; store = blank(); store.theme = theme; save(); S = null; M = null; MR = null; go('home'); } });
  },
  modalCancel(d, el, e){ if (el.classList.contains('scrim') && e.target !== el) return; closeModal(); },
  modalOk(){ const f = modalOk; closeModal(); if (f) f(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
app.addEventListener('change', e => {
  if (e.target && e.target.name === 'theme'){ store.theme = e.target.value; save(); applyTheme(); }
});
document.addEventListener('keydown', e => {
  if (modalEl.firstChild){
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  const n = parseInt(e.key, 10);
  if (view.name === 'quiz' && S){
    if (S.picked == null && n >= 1 && n <= 8){ e.preventDefault(); pick(n - 1); }
    else if (S.picked != null && (e.key === 'Enter' || e.key === 'ArrowRight') && e.target.tagName !== 'BUTTON'){ e.preventDefault(); next(); }
    else if (S.picked != null && e.key === 'ArrowRight'){ e.preventDefault(); next(); }
  } else if (view.name === 'mock' && M){
    const q = QMAP.get(M.ids[M.i]).q;
    if (n >= 1 && n <= q.choices.length){ e.preventDefault(); ACT.mpick({ i: n - 1 }); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); ACT.mnext(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); ACT.mprev(); }
  }
});

applyTheme();
render(false);
})();
</script>

</body>
</html>
